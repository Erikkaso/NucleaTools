apiVersion: v1
kind: Pod
metadata:
  name: voice-assets-loader
spec:
  restartPolicy: Never
  containers:
    - name: loader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: voice-assets
          mountPath: /voices
  volumes:
    - name: voice-assets
      persistentVolumeClaim:
        claimName: voice-assets
