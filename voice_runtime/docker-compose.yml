services:
  voice-runtime:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    gpus: all
    environment:
      TTS_WARMUP_TEXT: ${TTS_WARMUP_TEXT-Ola.}
      TTS_VOICE: ${TTS_VOICE:-default}
      TTS_VOICES_DIR: /voices
      TTS_VOICE_CACHE_DIR: /voice-cache
      TTS_MODEL_REVISION: v3
      TTS_LANGUAGE_ID: pt
      TTS_EXAGGERATION: "0.5"
      TTS_CFG_WEIGHT: "0.5"
    volumes:
      - ./voices:/voices:ro
      - voice-models:/root/.cache
      - voice-cache:/voice-cache

volumes:
  voice-models:
  voice-cache:
