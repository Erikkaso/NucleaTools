<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F7F7F5;
    --surface: #FFFFFF;
    --border: #E3E3DE;
    --text: #21221F;
    --text-muted: #74766F;
    --accent: #3B5BDB;
    --accent-hover: #2F49B8;
    --bot-bubble: #EFEFEA;
    --user-bubble: #3B5BDB;
    --user-text: #FFFFFF;
    --error: #B3261E;
    --radius: 14px;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
  }

  body{
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    justify-content: center;
    align-items: stretch;
  }

  .app{
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 20px;
  }

  header{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 4px 18px;
  }

  .dot{
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2F9E44;
    flex-shrink: 0;
  }

  .dot.offline{ background: var(--error); }

  header h1{
    font-size: 16px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .header-status{
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-status span{
    font-size: 13px;
    color: var(--text-muted);
    font-family: "IBM Plex Mono", monospace;
  }

  .wake-status.detected{ color: #2F9E44; }
  .wake-status.error{ color: var(--error); }

  .panel{
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }

  .messages{
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .messages:empty::before{
    content: "Escreva algo abaixo para começar a conversa.";
    color: var(--text-muted);
    font-size: 14px;
    margin: auto;
  }

  .row{
    display: flex;
    width: 100%;
  }

  .row.user{ justify-content: flex-end; }
  .row.bot{ justify-content: flex-start; }

  .bubble{
    max-width: 78%;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .row.user .bubble{
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }

  .row.bot .bubble{
    background: var(--bot-bubble);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }

  .row.bot .bubble.error{
    background: #FBEAE9;
    color: var(--error);
  }

  .row.bot .bubble.pending{
    color: var(--text-muted);
  }

  .dots{
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }

  .dots span{
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: blink 1.2s infinite ease-in-out;
  }

  .dots span:nth-child(2){ animation-delay: 0.15s; }
  .dots span:nth-child(3){ animation-delay: 0.3s; }

  @keyframes blink{
    0%, 80%, 100%{ opacity: 0.25; }
    40%{ opacity: 1; }
  }

  form{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px;
    border-top: 1px solid var(--border);
  }

  .hidden{ display: none !important; }

  .icon-button{
    width: 42px;
    height: 42px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }

  .icon-button:hover:not(:disabled){
    border-color: var(--accent);
    color: var(--accent);
  }

  .icon-button.recording{
    background: #FBEAE9;
    border-color: var(--error);
    color: var(--error);
  }

  .icon-button:disabled{
    opacity: 0.4;
    cursor: default;
  }

  .recording-indicator{
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 8px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    color: var(--text-muted);
  }

  .rec-dot{
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--error);
    animation: pulse 1.2s infinite ease-in-out;
    flex-shrink: 0;
  }

  @keyframes pulse{
    0%, 100%{ opacity: 1; }
    50%{ opacity: 0.25; }
  }

  .audio-bubble{
    padding: 8px 10px;
  }

  .audio-bubble audio{
    display: block;
    height: 36px;
    max-width: 220px;
  }

  textarea{
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 14.5px;
    line-height: 1.4;
    max-height: 120px;
    background: var(--bg);
    color: var(--text);
  }

  textarea:focus{
    outline: none;
    border-color: var(--accent);
  }

  button{
    border: none;
    background: var(--accent);
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 0 20px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button:hover:not(:disabled){ background: var(--accent-hover); }

  button:disabled{
    opacity: 0.5;
    cursor: default;
  }

  button:focus-visible, textarea:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (max-width: 480px){
    .app{ padding: 10px; }
    .bubble{ max-width: 88%; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <span class="dot" id="statusDot"></span>
    <h1>Assistente</h1>
    <div class="header-status">
      <span class="wake-status" id="wakeStatus" aria-live="polite">iniciando escuta</span>
      <span id="statusText">conectado ao n8n</span>
    </div>
  </header>

  <div class="panel">
    <div class="messages" id="messages"></div>

    <form id="chatForm">
      <textarea
        id="messageInput"
        placeholder="Escreva sua mensagem..."
        rows="1"
        autofocus
      ></textarea>

      <div class="recording-indicator hidden" id="recordingIndicator">
        <span class="rec-dot"></span>
        <span id="recTimer">0:00</span>
      </div>

      <button type="button" class="icon-button hidden" id="cancelRecordButton" title="Cancelar gravação">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>

      <button type="button" class="icon-button" id="micButton" title="Gravar áudio">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
      </button>

      <button type="submit" id="sendButton">Enviar</button>
    </form>
  </div>
</div>

<script src="{{ url_for('static', filename='vendor/tfjs/tf.min.js') }}" defer></script>
<script src="{{ url_for('static', filename='vendor/tfjs-tflite/tf-tflite.min.js') }}" defer></script>
<script>
  const form = document.getElementById('chatForm');
  const input = document.getElementById('messageInput');
  const messages = document.getElementById('messages');
  const sendButton = document.getElementById('sendButton');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const wakeStatus = document.getElementById('wakeStatus');

  function addMessage(text, role, options = {}) {
    const row = document.createElement('div');
    row.className = 'row ' + role;

    const bubble = document.createElement('div');
    bubble.className = 'bubble' + (options.error ? ' error' : '') + (options.pending ? ' pending' : '');
    bubble.innerHTML = options.pending ? '<span class="dots"><span></span><span></span><span></span></span>' : '';
    if (!options.pending) bubble.textContent = text;

    row.appendChild(bubble);
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;
    return bubble;
  }

  function replacePendingWithAudio(pendingBubble, audioBlob) {
    pendingBubble.classList.remove('pending');
    pendingBubble.classList.add('audio-bubble');
    pendingBubble.textContent = '';

    const player = document.createElement('audio');
    player.controls = true;
    player.autoplay = true;
    player.src = URL.createObjectURL(audioBlob);
    pendingBubble.appendChild(player);
  }

  async function handleAssistantAudio(res, pendingBubble) {
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      pendingBubble.classList.remove('pending');
      pendingBubble.classList.add('error');
      pendingBubble.textContent = data.error || 'Algo deu errado.';
      statusDot.classList.add('offline');
      statusText.textContent = 'erro ao falar com o n8n';
      return;
    }

    const audioBlob = await res.blob();
    if (!audioBlob.size || !audioBlob.type.startsWith('audio/')) {
      throw new Error('A resposta nao contem audio reproduzivel.');
    }
    replacePendingWithAudio(pendingBubble, audioBlob);
    statusDot.classList.remove('offline');
    statusText.textContent = 'conectado ao n8n';
  }

  function autoResize() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  }
  input.addEventListener('input', autoResize);

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  // ---------- Gravação de áudio ----------
  const micButton = document.getElementById('micButton');
  const cancelRecordButton = document.getElementById('cancelRecordButton');
  const recordingIndicator = document.getElementById('recordingIndicator');
  const recTimer = document.getElementById('recTimer');

  const MIC_ICON = micButton.innerHTML;
  const STOP_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"></rect></svg>';

  let mediaRecorder = null;
  let mediaStream = null;
  let audioChunks = [];
  let recordingStart = null;
  let timerHandle = null;
  let wakewordListener = null;
  let wakewordRuntime = null;
  let automaticRecording = false;
  let voiceActivityContext = null;
  let voiceActivityAnalyser = null;
  let voiceActivitySamples = null;
  let voiceActivityTimer = null;
  let voiceCaptureState = null;

  const AUTOMATIC_MAXIMUM_MS = 20000;
  const VOICE_RMS_THRESHOLD = 0.015;

  const canRecord = !!(navigator.mediaDevices && window.MediaRecorder);
  if (!canRecord) {
    micButton.disabled = true;
    micButton.title = 'Gravação de áudio não suportada neste navegador';
  }

  function pickMimeType() {
    const candidates = [
      'audio/webm;codecs=opus',
      'audio/webm',
      'audio/mp4',
      'audio/ogg;codecs=opus',
      'audio/ogg',
    ];
    return candidates.find((type) => MediaRecorder.isTypeSupported(type)) || '';
  }

  function formatElapsed(ms) {
    const totalSeconds = Math.floor(ms / 1000);
    const m = Math.floor(totalSeconds / 60);
    const s = totalSeconds % 60;
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function enterRecordingUI() {
    input.classList.add('hidden');
    sendButton.classList.add('hidden');
    recordingIndicator.classList.remove('hidden');
    cancelRecordButton.classList.remove('hidden');
    micButton.classList.add('recording');
    micButton.innerHTML = STOP_ICON;
    micButton.title = 'Parar e enviar';
  }

  function exitRecordingUI() {
    input.classList.remove('hidden');
    sendButton.classList.remove('hidden');
    recordingIndicator.classList.add('hidden');
    cancelRecordButton.classList.add('hidden');
    micButton.classList.remove('recording');
    micButton.innerHTML = MIC_ICON;
    micButton.title = 'Gravar áudio';
    recTimer.textContent = '0:00';
    clearInterval(timerHandle);
  }

  function stopVoiceActivityMonitoring() {
    clearInterval(voiceActivityTimer);
    voiceActivityTimer = null;
    voiceActivityAnalyser?.disconnect();
    voiceActivityContext?.close();
    voiceActivityContext = null;
    voiceActivityAnalyser = null;
    voiceActivitySamples = null;
    voiceCaptureState = null;
    automaticRecording = false;
  }

  function currentRms() {
    voiceActivityAnalyser.getFloatTimeDomainData(voiceActivitySamples);
    let total = 0;
    for (const sample of voiceActivitySamples) total += sample * sample;
    return Math.sqrt(total / voiceActivitySamples.length);
  }

  function startVoiceActivityMonitoring(stream) {
    stopVoiceActivityMonitoring();
    automaticRecording = true;
    voiceActivityContext = new AudioContext();
    const source = voiceActivityContext.createMediaStreamSource(stream);
    voiceActivityAnalyser = voiceActivityContext.createAnalyser();
    voiceActivityAnalyser.fftSize = 1024;
    voiceActivitySamples = new Float32Array(voiceActivityAnalyser.fftSize);
    source.connect(voiceActivityAnalyser);
    voiceCaptureState = {
      startedAt: performance.now(),
      lastSpeechAt: performance.now(),
    };

    voiceActivityTimer = setInterval(() => {
      if (mediaRecorder?.state !== 'recording') {
        stopVoiceActivityMonitoring();
        return;
      }

      const now = performance.now();
      if (currentRms() >= VOICE_RMS_THRESHOLD) voiceCaptureState.lastSpeechAt = now;

      if (wakewordRuntime.shouldStopVoiceCapture(voiceCaptureState, now, {
        silenceMs: wakewordRuntime.AUTOMATIC_SILENCE_MS,
        maximumMs: AUTOMATIC_MAXIMUM_MS,
      })) {
        stopRecordingAndSend();
      }
    }, 100);
  }

  async function startRecording({ automatic = false } = {}) {
    if (mediaRecorder?.state === 'recording') return;

    try {
      mediaStream = wakewordListener?.stream?.active
        ? wakewordListener.stream.clone()
        : await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      addMessage('Não foi possível acessar o microfone. Verifique a permissão do navegador.', 'bot', { error: true });
      return;
    }

    const mimeType = pickMimeType();
    mediaRecorder = mimeType ? new MediaRecorder(mediaStream, { mimeType }) : new MediaRecorder(mediaStream);
    audioChunks = [];

    mediaRecorder.addEventListener('dataavailable', (e) => {
      if (e.data && e.data.size > 0) audioChunks.push(e.data);
    });

    mediaRecorder.addEventListener('stop', () => {
      stopVoiceActivityMonitoring();
      mediaStream.getTracks().forEach((track) => track.stop());
      mediaStream = null;
    });

    mediaRecorder.start();
    recordingStart = Date.now();
    timerHandle = setInterval(() => {
      recTimer.textContent = formatElapsed(Date.now() - recordingStart);
    }, 250);
    enterRecordingUI();
    if (automatic) startVoiceActivityMonitoring(mediaStream);
  }

  function stopRecordingAndSend() {
    if (!mediaRecorder || mediaRecorder.state === 'inactive') return;
    const recorder = mediaRecorder;
    stopVoiceActivityMonitoring();
    recorder.addEventListener('stop', () => {
      const mimeType = recorder.mimeType || 'audio/webm';
      const blob = new Blob(audioChunks, { type: mimeType });
      sendAudio(blob, mimeType);
    }, { once: true });
    recorder.stop();
    exitRecordingUI();
  }

  function cancelRecording() {
    stopVoiceActivityMonitoring();
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
    audioChunks = [];
    exitRecordingUI();
  }

  micButton.addEventListener('click', () => {
    if (!canRecord) return;
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      stopRecordingAndSend();
    } else {
      startRecording();
    }
  });

  cancelRecordButton.addEventListener('click', cancelRecording);

  async function sendAudio(blob, mimeType) {
    const ext = mimeType.includes('webm') ? 'webm'
      : mimeType.includes('mp4') ? 'm4a'
      : mimeType.includes('ogg') ? 'ogg'
      : 'audio';

    const row = document.createElement('div');
    row.className = 'row user';
    const bubble = document.createElement('div');
    bubble.className = 'bubble audio-bubble';
    bubble.innerHTML = `<audio controls src="${URL.createObjectURL(blob)}"></audio>`;
    row.appendChild(bubble);
    messages.appendChild(row);
    messages.scrollTop = messages.scrollHeight;

    input.disabled = true;
    sendButton.disabled = true;
    micButton.disabled = true;

    const pendingBubble = addMessage('', 'bot', { pending: true });

    const formData = new FormData();
    formData.append('audio', blob, `gravacao.${ext}`);

    try {
      const res = await fetch('/api/chat-audio', { method: 'POST', body: formData });
      await handleAssistantAudio(res, pendingBubble);
    } catch (err) {
      pendingBubble.classList.remove('pending');
      pendingBubble.classList.add('error');
      pendingBubble.textContent = 'Não foi possível conectar ao servidor.';
      statusDot.classList.add('offline');
      statusText.textContent = 'sem conexão';
    } finally {
      input.disabled = false;
      sendButton.disabled = false;
      micButton.disabled = false;
      messages.scrollTop = messages.scrollHeight;
    }
  }
  // ---------- Fim gravação de áudio ----------

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    input.value = '';
    autoResize();
    input.disabled = true;
    sendButton.disabled = true;

    const pendingBubble = addMessage('', 'bot', { pending: true });

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text })
      });
      await handleAssistantAudio(res, pendingBubble);
    } catch (err) {
      pendingBubble.classList.remove('pending');
      pendingBubble.classList.add('error');
      pendingBubble.textContent = 'Não foi possível conectar ao servidor.';
      statusDot.classList.add('offline');
      statusText.textContent = 'sem conexão';
    } finally {
      input.disabled = false;
      sendButton.disabled = false;
      input.focus();
      messages.scrollTop = messages.scrollHeight;
    }
  });

  function setWakeStatus(text, state = '') {
    wakeStatus.textContent = text;
    wakeStatus.className = `wake-status ${state}`.trim();
  }

  async function startWakewordListener() {
    wakewordRuntime = await import(
      "{{ url_for('static', filename='wakeword.mjs') }}"
    );
    const { WakewordListener } = wakewordRuntime;

    wakewordListener = new WakewordListener({
      onStatus: (text) => setWakeStatus(text),
      onScore: (score) => {
        if (!automaticRecording) setWakeStatus(`escutando ${Math.round(score * 100)}%`);
      },
      onWake: (score) => {
        if (!canRecord || mediaRecorder?.state === 'recording') return;
        setWakeStatus(`gravando ${Math.round(score * 100)}%`, 'detected');
        navigator.vibrate?.(60);
        startRecording({ automatic: true });
      },
      onError: (error) => {
        console.error('Falha no detector de palavra-chave:', error);
        setWakeStatus('escuta indisponivel', 'error');
      },
    });

    await wakewordListener.start();
  }

  window.addEventListener('DOMContentLoaded', () => {
    startWakewordListener().catch((error) => {
      console.error('Nao foi possivel iniciar o detector de palavra-chave:', error);
      setWakeStatus('escuta indisponivel', 'error');
    });
  });

  window.addEventListener('pointerdown', () => {
    wakewordListener?.resume();
  }, { once: true });

  window.addEventListener('beforeunload', () => {
    wakewordListener?.stop();
  });
</script>

</body>
</html>
