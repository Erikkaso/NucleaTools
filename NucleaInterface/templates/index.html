<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8f7">
  <title>Nuclea</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='mic.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='voice-ui.css') }}">
</head>
<body>
  <main id="voiceApp" class="voice-app" data-state="idle"
        data-tts-prebuffer-seconds="{{ prebuffer_seconds | default(3) }}"
        data-tts-audio-progress-timeout-seconds="{{ progress_seconds | default(60) }}">
    <header><h1>Nuclea</h1></header>
    <section class="voice-stage" aria-label="Assistente de voz">
      <canvas id="waveform" width="960" height="280" aria-label="Amplitude de voz" role="img"></canvas>
      <p id="voiceStatus" role="status" aria-live="polite" aria-atomic="true">Pronta</p>
      <p id="voiceError" role="alert" hidden></p>
      <div class="voice-controls">
        <button id="speakButton" class="speak-button" type="button" title="Falar" aria-label="Falar" aria-pressed="false">
          <img id="micIcon" src="{{ url_for('static', filename='mic.svg') }}" width="30" height="30" alt="" aria-hidden="true">
          <span id="speakSymbol" aria-hidden="true" hidden>&#9632;</span>
        </button>
        <button id="cancelButton" class="cancel-button" type="button" title="Cancelar" aria-label="Cancelar" disabled>
          <span aria-hidden="true">&#215;</span>
        </button>
      </div>
    </section>
  </main>
  <script type="module" src="{{ url_for('static', filename='voice-ui.mjs') }}"></script>
</body>
</html>
