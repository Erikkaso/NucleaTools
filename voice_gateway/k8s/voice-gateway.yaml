apiVersion: v1
kind: ConfigMap
metadata:
  name: voice-gateway
  namespace: ollama-system
data:
  # Replace with the production URL of your already active streaming workflow.
  N8N_WEBHOOK_URL: "https://n8n.example.com/webhook/REPLACE_WITH_YOUR_WEBHOOK_ID"
  # This must reach the same TTS instance that creates n8n's stream tickets.
  TTS_BASE_URL: "http://ollama-service.ollama-system.svc.cluster.local:8000"
  N8N_TIMEOUT_SECONDS: "220"
  TTS_STREAM_TIMEOUT_SECONDS: "90"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-gateway
  namespace: ollama-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voice-gateway
  template:
    metadata:
      labels:
        app: voice-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: voice-gateway
          image: nuclic/voice_gateway:1.2
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: voice-gateway
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: voice-gateway
  namespace: ollama-system
spec:
  type: NodePort
  selector:
    app: voice-gateway
  ports:
    - name: http
      port: 5000
      targetPort: http
      nodePort: 30500
